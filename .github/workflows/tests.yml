name: Unit tests

on:
  push:
  pull_request:

jobs:
  deterministic-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install numpy pytest pytest-cov
      - name: Run deterministic unit tests with coverage
        run: pytest
